name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run unit tests
        run: python -m pytest -v

  pipeline:
    name: Train and evaluate
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run the full pipeline
        run: python -m spam_detector.pipeline
      - name: Check the model beats the baseline
        run: |
          python -c "
          import json
          metrics = json.load(open('models/metrics.json'))
          assert metrics['accuracy'] > 0.9, metrics
          "
      - name: Upload training report
        uses: actions/upload-artifact@v4
        with:
          name: training-report
          path: |
            models/metrics.json
            reports/

  docker:
    name: Docker and monitoring stack
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config -q
      - name: Validate Prometheus config and alerts
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Check every service responds
        run: |
          retry="--retry 15 --retry-delay 3 --retry-all-errors"
          curl -fsS $retry localhost:8501/_stcore/health
          curl -fsS $retry localhost:9090/-/ready
          curl -fsS $retry localhost:3000/api/health
      - name: Check Grafana loaded the dashboard
        run: |
          curl -fsS --retry 15 --retry-delay 3 --retry-all-errors -u admin:admin \
            localhost:3000/api/dashboards/uid/sms-spam-detector > /dev/null
      - name: Check Prometheus scrapes the app
        run: |
          for attempt in $(seq 1 20); do
            if curl -fsS 'localhost:9090/api/v1/query?query=spam_model_test_score' | grep -q accuracy; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
